<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail Dot Trick Alias Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a1a;
      font-family: 'Share Tech Mono', monospace;
      padding: 20px;
    }

    .wrap {
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 24px;
      border-radius: 8px;
      border: 1px solid #39FF14;
      box-shadow: 0 0 25px rgba(57,255,20,0.6);
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
    }

    .logo {
      display: block;
      width: 120px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(5,217,232,0.3);
      margin: 0 auto 20px;
    }

    h2 {
      color: #39FF14;
      font-size: 20px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(57,255,20,0.6);
      margin-bottom: 14px;
    }

    p.desc {
      color: #e0e0e0;
      font-size: 0.88em;
      text-align: left;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    #gmailInput {
      width: 100%;
      padding: 11px 12px;
      background: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 4px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1em;
      outline: none;
      margin-bottom: 10px;
    }
    #gmailInput:focus { border-color: #05D9E8; box-shadow: 0 0 8px rgba(5,217,232,0.5); }
    #gmailInput::placeholder { color: #555; }

    #generateBtn {
      width: 100%;
      padding: 11px;
      background: #05D9E8;
      color: #1a1a1a;
      border: none;
      border-radius: 4px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1em;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(5,217,232,0.6);
      transition: background 0.2s;
    }
    #generateBtn:hover { background: #e0e0e0; }

    #resultBox {
      background: rgba(42,42,42,0.6);
      border: 1px dashed #444;
      border-radius: 6px;
      max-height: 220px;
      overflow-y: auto;
      padding: 12px;
      margin-top: 14px;
      text-align: left;
      font-size: 0.88em;
    }

    .placeholder-msg {
      text-align: center;
      color: #555;
    }

    .error-msg {
      color: #FF2A6D;
      font-weight: bold;
      text-align: center;
      padding: 8px;
    }

    .result-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px dashed rgba(68,68,68,0.4);
    }
    .result-row:last-child { border-bottom: none; }

    .alias-text {
      color: #39FF14;
      flex-grow: 1;
      margin-right: 10px;
      word-break: break-all;
    }

    .copy-btn {
      padding: 3px 8px;
      background: #9B59B6;
      color: #1a1a1a;
      border: none;
      border-radius: 4px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.78em;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 0 4px rgba(155,89,182,0.6);
    }
    .copy-btn:hover { background: #e0e0e0; }
    .copy-btn.copied { background: #39FF14; }

    #totalCount {
      color: #FF9900;
      font-weight: bold;
      text-align: center;
      margin-top: 12px;
      font-size: 0.95em;
      text-shadow: 0 0 5px rgba(255,153,0,0.4);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo"
      src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgAX5W6MONi8901FuKco8q0VyYJCoghmxG5GKXAiUu53Mg5Cg2R6-_y6IwUdRUlHnBD_FeLVjSTxg1NvxiK7LWFic3XD7uGnI595ZRrBhUezhNHFpO6354OCz84eQHDe6t6SK0H6cwgO1GR3J7mve-KC1iAN1N1r11JSZnk4NCn2hU-d-uxQYg_KBXbL60/s320/1000010119.webp"
      alt="Gmail Dot Trick Logo">

    <h2>Gmail Dot Trick Alias Generator</h2>

    <p class="desc">Enter the username part of your Gmail address (the text before "@gmail.com") to see all possible dot variations you can use as aliases. Click Copy to grab any one instantly!</p>

    <input type="text" id="gmailInput" placeholder="Enter your Gmail username">
    <button id="generateBtn">Generate Variations</button>

    <div id="resultBox">
      <p class="placeholder-msg">Your generated aliases will appear here.</p>
    </div>

    <div id="totalCount">Total Variations: 0</div>
  </div>

  <script>
    function getDotVariations(username) {
      var clean = username.replace(/[^a-zA-Z0-9]/g, '');
      var n = clean.length;
      var results = [];
      if (n === 0) return results;
      if (n === 1) { results.push(clean); return results; }
      var max = 1 << (n - 1);
      var seen = {};
      for (var mask = 0; mask < max; mask++) {
        var word = '';
        for (var i = 0; i < n; i++) {
          word += clean[i];
          if (i < n - 1 && (mask & (1 << i))) word += '.';
        }
        if (!seen[word]) { seen[word] = true; results.push(word); }
      }
      return results;
    }

    function showError(msg) {
      var box = document.getElementById('resultBox');
      box.innerHTML = '';
      var p = document.createElement('p');
      p.className = 'error-msg';
      p.textContent = msg;
      box.appendChild(p);
    }

    function copyAlias(btn, text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
          btn.textContent = 'Copied!';
          btn.className = 'copy-btn copied';
          setTimeout(function() {
            btn.textContent = 'Copy';
            btn.className = 'copy-btn';
          }, 2000);
        }).catch(function() {
          fallbackCopy(btn, text);
        });
      } else {
        fallbackCopy(btn, text);
      }
    }

    function fallbackCopy(btn, text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        btn.textContent = 'Copied!';
        btn.className = 'copy-btn copied';
        setTimeout(function() {
          btn.textContent = 'Copy';
          btn.className = 'copy-btn';
        }, 2000);
      } catch(e) {
        alert('Copy failed. Please copy manually: ' + text);
      }
      document.body.removeChild(ta);
    }

    function generate() {
      var input = document.getElementById('gmailInput').value.trim();
      var box = document.getElementById('resultBox');
      var total = document.getElementById('totalCount');

      box.innerHTML = '';
      total.textContent = 'Total Variations: 0';

      if (!input) { showError('Please enter your Gmail username.'); return; }
      if (!/^[a-zA-Z0-9]+$/.test(input)) { showError('Only letters and numbers please — no dots or symbols.'); return; }

      var variations = getDotVariations(input);
      if (variations.length === 0) { showError('Could not generate variations.'); return; }

      for (var i = 0; i < variations.length; i++) {
        var email = variations[i] + '@gmail.com';

        var row = document.createElement('div');
        row.className = 'result-row';

        var span = document.createElement('span');
        span.className = 'alias-text';
        span.textContent = email;

        var btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';

        (function(b, e) {
          b.addEventListener('click', function() { copyAlias(b, e); });
        })(btn, email);

        row.appendChild(span);
        row.appendChild(btn);
        box.appendChild(row);
      }

      total.textContent = 'Total Variations: ' + variations.length;
    }

    document.getElementById('generateBtn').addEventListener('click', generate);
    document.getElementById('gmailInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') generate();
    });
  </script>
</body>
</html>
